name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Everything except the CUDA weights extra (torch is never imported by the hermetic suite).
      - run: uv sync --all-extras --no-extra hf
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests
      - run: uv run mypy --strict src
      - run: uv run mesa-anyjev questions --check
      - run: uv run pytest -q --cov=mesa_anyjev --cov-report=term --cov-report=xml

  vendored:
    name: vendored files are byte-identical to upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: AnyJev bench/metrics.py sha256 matches THIRD_PARTY.md
        run: |
          echo "df0af62c248f27cc806c90266ae62c28b47df8dd8aa9645de815dedc50d7bbbe  src/mesa_anyjev/bench/_metrics.py" | sha256sum -c -
