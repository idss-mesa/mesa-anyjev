[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mesa-anyjev"
dynamic = ["version"]
description = "Declarative, calibrated ontology and schema decisions for the MESA stack: AnyJev typed decisions over mesa-mcp's OBO/OLS tools with provenance in mesa-ducklake."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "IDSS / MESA contributors, University of New Mexico" }]
keywords = ["mesa", "anyjev", "jev", "ontology", "obo", "ols", "irods", "ducklake", "calibration", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    # AnyJev: PyPI 0.0.2 has no L2 / observe / route; pin the git commit (DESIGN D0).
    # Pinned to git commits in [tool.uv.sources] below (uv resolves them; hatch metadata stays clean).
    "anyjev",
    # The MESA stack (neither is on PyPI; DESIGN D0).
    "mesa-mcp",
    "mesa-ducklake",
    "numpy>=1.24",
    "pydantic>=2.7",
    "httpx>=0.28",
    "pyyaml>=6",
    "structlog>=24",
    "duckdb>=1.1",
    "platformdirs>=4",
]

[project.optional-dependencies]
# Tokenizer for the CARC gateway backend (label token ids must match the served checkpoint).
gateway = ["transformers>=4.53", "tokenizers>=0.20", "huggingface-hub>=0.25"]
# Local hidden states for L2 on a CUDA host (this GB10 resolves torch 2.14 CUDA 13 wheels).
hf = ["torch>=2.3", "transformers>=4.53", "accelerate>=1.0"]
# Claude planner and structured-output provider (M2+).
claude = ["anthropic>=1.0"]
# Postgres provenance sidecar (production).
pg = ["psycopg[binary]>=3.2"]
# End-to-end test against mesa-ducklake main's tests/llm_e2e harness over MCP stdio (M4).
e2e = ["mcp>=2,<3"]
docs = ["zensical>=0.0.60", "pyyaml>=6"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "jsonschema>=4",
]

[project.scripts]
mesa-anyjev = "mesa_anyjev.cli:main"

# Registers the mesa_decide_* tools into mesa-mcp once its entry-point loader exists
# (mesa-mcp PR 1, DESIGN D9). Until then: `import mesa_anyjev.mcp_tools` before MesaServer().
[project.entry-points."mesa_mcp.tools"]
decide = "mesa_anyjev.mcp_tools"

[project.urls]
Homepage = "https://github.com/idss-mesa/mesa-anyjev"
Documentation = "https://idss-mesa.github.io/mesa-anyjev/"
Source = "https://github.com/idss-mesa/mesa-anyjev"
Issues = "https://github.com/idss-mesa/mesa-anyjev/issues"
Changelog = "https://github.com/idss-mesa/mesa-anyjev/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/mesa_anyjev/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mesa_anyjev"]

[tool.hatch.build.targets.sdist]
include = ["src/mesa_anyjev", "tests", "README.md", "CHANGELOG.md", "LICENSE", "THIRD_PARTY.md", "questions.lock.json", "policy_defaults.yaml"]

[tool.uv.sources]
anyjev = { git = "https://github.com/nokia-applied-research/AnyJev", rev = "795a4970b47218b7c0686cd579d691fc2cf8df2f" }
mesa-mcp = { git = "https://github.com/idss-mesa/mesa-mcp", rev = "95a636a1bd3413044f0040eeacc38c538faa2012" }
mesa-ducklake = { git = "https://github.com/idss-mesa/mesa-ducklake", rev = "7bc143fefb093f0a2ace748a7036598147533ca0" }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "site",
    "docs",
    # vendored unchanged from idss-mesa/neon-mcp (keep identical to upstream)
    "scripts/okf_validate.py",
    "scripts/gen_llms_txt.py",
    "scripts/postbuild_agent_surface.py",
    # vendored byte-identical from nokia-applied-research/AnyJev bench/metrics.py (THIRD_PARTY.md)
    "src/mesa_anyjev/bench/_metrics.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]
ignore = [
    "S105",  # hardcoded-password heuristics fire on constants named *TOKEN* (env var names)
    "S106",
    "S107",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "S603", "B011", "RUF012"]
"tests/conftest.py" = ["E501"]  # verbatim dataset-card lines
"scripts/**" = ["S603", "S607", "S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: hits the real EMBL-EBI OLS API or the Claude API (opt-in; MESA_ANYJEV_LIVE=1)",
    "engine: drives a real decision backend (MESA_ANYJEV_ENGINE=gateway|hf); needs the tunnel or a GPU",
    "requires_postgres: needs a Postgres reachable through MESA_ANYJEV_TEST_PG_*",
    "e2e: spawns the real mesa-mcp over MCP stdio through mesa-ducklake's llm_e2e harness (MESA_ANYJEV_E2E=1)",
    "hosted: calls MotherDuck prompt_jev (MESA_ANYJEV_MOTHERDUCK=1; data leaves the host)",
]
addopts = "-ra -m 'not live and not engine and not requires_postgres and not e2e and not hosted'"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["mesa_anyjev"]
branch = true
omit = ["src/mesa_anyjev/bench/_metrics.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload", "\\.\\.\\."]

[tool.mypy]
# 3.12: numpy's stubs use the `type` statement; the package itself supports 3.11 (CI runs it).
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "anyjev", "anyjev.*",
    "mesa_ducklake", "mesa_ducklake.*",
    "mesa_mcp", "mesa_mcp.*",
    "irods", "irods.*",
    "transformers", "transformers.*",
    "torch", "torch.*",
    "duckdb", "duckdb.*",
    "psycopg", "psycopg.*",
    "anthropic", "anthropic.*",
    "structlog", "structlog.*",
    "yaml", "yaml.*",
    "platformdirs",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Vendored byte-identical from AnyJev; not ours to annotate.
module = ["mesa_anyjev.bench._metrics"]
ignore_errors = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
